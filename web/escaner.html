<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeTicket — escáner de puerta</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --bg: #111110; --card: #1a1a19; --border: #33332f;
    --ink: #fff; --ink2: #c3c2b7; --ink3: #94938a;
    --accent: #3987e5; --ok: #199e70; --dup: #c98500; --bad: #e66767;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5
         ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 14px 14px 40px; }

  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top select { flex: 1; min-width: 0; background: var(--card); color: var(--ink);
                border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px;
                font-size: 14px; }
  .net { font-size: 12px; padding: 4px 9px; border-radius: 999px;
         border: 1px solid var(--border); color: var(--ink2); white-space: nowrap; }
  .net.off { color: var(--dup); border-color: var(--dup); }

  .count { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
           padding: 16px 18px; margin-bottom: 12px; }
  .count .n { font-size: 44px; font-weight: 650; line-height: 1;
              letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .count .l { color: var(--ink2); font-size: 14px; margin-top: 4px; }
  .track { height: 8px; border-radius: 4px; background: var(--border);
           margin-top: 12px; overflow: hidden; }
  .track > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  #cam { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000;
         border-radius: 14px; display: block; }
  .camwrap { position: relative; margin-bottom: 12px; }
  .reticle { position: absolute; inset: 18%; border: 2px solid rgba(255,255,255,.55);
             border-radius: 14px; pointer-events: none; }
  .flash { position: absolute; inset: 0; border-radius: 14px; opacity: 0;
           pointer-events: none; transition: opacity .18s; }
  .flash.on { opacity: .55; }

  button { font: inherit; border-radius: 10px; border: 1px solid var(--border);
           background: var(--card); color: var(--ink); padding: 11px 14px;
           cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; font-weight: 600; width: 100%; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row input { flex: 1; min-width: 0; background: var(--card); color: var(--ink);
               border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px;
               font-family: ui-monospace, monospace; font-size: 13px; }

  .banner { border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
            font-weight: 600; display: none; }
  .banner.show { display: block; }
  .banner .s { font-weight: 400; font-size: 13.5px; opacity: .9; margin-top: 2px; }
  .b-ok  { background: var(--ok);  color: #fff; }
  .b-dup { background: var(--dup); color: #1a1a19; }
  .b-bad { background: var(--bad); color: #1a1a19; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px;
       border-top: 1px solid var(--border); font-size: 13.5px; }
  li .t { font-family: ui-monospace, monospace; color: var(--ink2); }
  li .r { font-weight: 600; white-space: nowrap; }
  .r-ok { color: var(--ok); } .r-dup { color: var(--dup); } .r-bad { color: var(--bad); }
  .r-q  { color: var(--ink3); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--ink3); margin: 18px 0 6px; }
  .hint { color: var(--ink3); font-size: 12.5px; margin: 8px 0 0; }
  details { margin-top: 18px; }
  summary { color: var(--ink3); font-size: 13px; cursor: pointer; }
  details .row { margin-top: 10px; }
</style>

<div class="wrap">
  <div class="top">
    <select id="ev"></select>
    <span class="net" id="net">en línea</span>
  </div>

  <div class="count">
    <div class="n"><span id="in">0</span> <span style="font-size:20px;color:var(--ink3)">/ <span id="exp">–</span></span></div>
    <div class="l" id="lbl">adentro · esperados</div>
    <div class="track"><div id="bar"></div></div>
  </div>

  <div class="banner" id="ban"></div>

  <div class="camwrap">
    <video id="cam" playsinline muted></video>
    <div class="reticle"></div>
    <div class="flash" id="flash"></div>
  </div>

  <button class="primary" id="start">Encender la cámara</button>
  <p class="hint" id="camhint"></p>

  <h2>A mano</h2>
  <div class="row">
    <input id="manual" placeholder="FT1.ft_tkt_0000001.ft_evt_0031.…" autocomplete="off">
    <button id="send">Validar</button>
  </div>

  <h2>Últimos escaneos</h2>
  <ul id="log"></ul>

  <details>
    <summary>Configuración</summary>
    <div class="row">
      <input id="api" placeholder="https://…lambda-url.us-east-1.on.aws/">
      <button id="saveapi">Guardar</button>
    </div>
    <p class="hint">Endpoint del ingest. Se guarda en este teléfono. También se puede pasar por <code>?api=</code>.</p>
  </details>
</div>

<script>
const $ = s => document.querySelector(s);
const LS_API = 'ft_api', LS_Q = 'ft_queue', LS_DEV = 'ft_device';

const qs = new URLSearchParams(location.search);
if (qs.get('api')) localStorage.setItem(LS_API, qs.get('api'));
let API = localStorage.getItem(LS_API) || '';
$('#api').value = API;

let DEVICE = localStorage.getItem(LS_DEV);
if (!DEVICE) { DEVICE = 'puerta-' + Math.random().toString(36).slice(2, 7);
               localStorage.setItem(LS_DEV, DEVICE); }

let queue = JSON.parse(localStorage.getItem(LS_Q) || '[]');
const saveQ = () => localStorage.setItem(LS_Q, JSON.stringify(queue));
const seen = new Set();          // ticket_id que este dispositivo ya dejó entrar
let events = [], current = null, serverCount = null;

// ---------- red ----------
function net() {
  const on = navigator.onLine;
  $('#net').textContent = on ? (queue.length ? queue.length + ' en cola' : 'en línea') : 'sin señal';
  $('#net').className = 'net' + (on && !queue.length ? '' : ' off');
}
addEventListener('online', () => { net(); flush(); });
addEventListener('offline', net);

// ---------- catálogo de eventos ----------
fetch('data.json').then(r => r.json()).then(d => {
  events = d.events;
  $('#ev').innerHTML = events.map(e =>
    '<option value="' + e.event_id + '">' + e.venue + ' — ' + e.title.slice(0, 34) + '</option>').join('');
  pick(events[0].event_id);
}).catch(() => { $('#ev').innerHTML = '<option>sin data.json</option>'; });

$('#ev').onchange = e => pick(e.target.value);

function pick(id) {
  current = events.find(e => e.event_id === id) || null;
  seen.clear(); serverCount = null;
  render(); refreshAforo();
}

function render() {
  const local = seen.size;
  const n = serverCount !== null ? Math.max(serverCount, local) : local;
  $('#in').textContent = n;
  $('#exp').textContent = current ? current.expected : '–';
  $('#bar').style.width = current ? Math.min(100, n / current.expected * 100) + '%' : '0';
  $('#lbl').textContent = current
    ? 'adentro · esperados ' + current.expected + ' (rango ' + current.p10 + '–' + current.p90 + ')'
    : 'adentro · esperados';
  net();
}

async function refreshAforo() {
  if (!API || !current) return;
  try {
    const r = await fetch(API.replace(/\/$/, '') + '/aforo?event_id=' + current.event_id);
    if (r.ok) { serverCount = (await r.json()).adentro; render(); }
  } catch (e) { /* sin red: se queda con el conteo local */ }
}
setInterval(refreshAforo, 15000);

// ---------- feedback ----------
const CLS = { ok: 'b-ok', duplicado: 'b-dup', ya_recibido: 'b-dup', encolado: 'b-dup' };
const TXT = {
  ok: ['Adelante', 'entrada válida'],
  duplicado: ['Ya entró', 'este pase se escaneó antes'],
  ya_recibido: ['Ya registrado', 'este escaneo ya estaba en el servidor'],
  firma_invalida: ['No válido', 'el código no está firmado por FreeTicket'],
  evento_equivocado: ['Otro show', 'este pase no es de este evento'],
  expirado: ['Vencido', 'el pase ya caducó'],
  encolado: ['Guardado', 'sin señal — se sube cuando vuelva'],
  sin_scan_id: ['Error', 'escaneo sin identificador'],
};
function banner(result) {
  const [t, s] = TXT[result] || ['Error', result];
  const b = $('#ban');
  b.className = 'banner show ' + (CLS[result] || 'b-bad');
  b.innerHTML = t + '<div class="s">' + s + '</div>';
  const f = $('#flash');
  f.style.background = result === 'ok' ? 'var(--ok)' : (CLS[result] ? 'var(--dup)' : 'var(--bad)');
  f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 180);
  if (navigator.vibrate) navigator.vibrate(result === 'ok' ? 40 : [60, 50, 60]);
  clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove('show'), 2600);
}

function logLine(qr, result) {
  const cls = result === 'ok' ? 'r-ok' : (CLS[result] ? 'r-dup' : 'r-bad');
  const tid = (qr || '').split('.')[1] || '—';
  const li = document.createElement('li');
  li.innerHTML = '<span class="t">' + tid + '</span><span class="r ' +
                 (result === 'encolado' ? 'r-q' : cls) + '">' + result + '</span>';
  $('#log').prepend(li);
  while ($('#log').children.length > 12) $('#log').lastChild.remove();
}

// ---------- el escaneo ----------
let lastCode = '', lastAt = 0;

async function handle(qr) {
  const now = Date.now();
  if (qr === lastCode && now - lastAt < 3000) return;   // la cámara ve el mismo QR 30 veces
  lastCode = qr; lastAt = now;

  const scan = {
    scan_id: (crypto.randomUUID ? crypto.randomUUID()
              : now + '-' + Math.random().toString(36).slice(2)),
    qr,
    event_id: current ? current.event_id : '',
    scanned_at: new Date().toISOString(),
    device_id: DEVICE,
    gate: 'principal',
    offline: !navigator.onLine,
  };

  // Optimista: la puerta no espera a la red. Si el ticket ya lo dejó pasar
  // este mismo dispositivo, es duplicado sin consultar nada.
  const tid = qr.split('.')[1];
  const localDup = tid && seen.has(tid);
  if (tid && !localDup) seen.add(tid);
  render();

  queue.push(scan); saveQ(); net();

  if (localDup) { banner('duplicado'); logLine(qr, 'duplicado'); flush(); return; }

  const results = await flush();
  const mine = results && results[scan.scan_id];
  const shown = mine || (navigator.onLine && API ? 'ok' : 'encolado');
  banner(shown); logLine(qr, shown);
  if (mine && mine !== 'ok') { if (tid) seen.delete(tid); render(); }
}

let flushing = false;
async function flush() {
  if (flushing || !API || !queue.length || !navigator.onLine) { net(); return null; }
  flushing = true;
  const batch = queue.slice(0, 200);
  try {
    const r = await fetch(API.replace(/\/$/, '') + '/scan', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ scans: batch }),
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const ids = new Set(batch.map(s => s.scan_id));
    queue = queue.filter(s => !ids.has(s.scan_id));   // idempotente: reenviar no duplica
    saveQ(); net();
    const map = {};
    for (const x of data.resultados || []) map[x.scan_id] = x.result;
    refreshAforo();
    return map;
  } catch (e) {
    net();               // se queda en cola; se reintenta al volver la red
    return null;
  } finally { flushing = false; }
}
setInterval(flush, 8000);

// ---------- cámara ----------
$('#start').onclick = async () => {
  if (!('BarcodeDetector' in window)) {
    $('#camhint').textContent =
      'Este navegador no trae lector de códigos (Safari no lo soporta). ' +
      'Usá Chrome en Android/escritorio, o pegá el código a mano abajo.';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false });
    const v = $('#cam');
    v.srcObject = stream; await v.play();
    $('#start').textContent = 'Cámara encendida';
    $('#start').disabled = true;
    $('#camhint').textContent = 'Apuntá al QR del pase.';

    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const tick = async () => {
      if (v.readyState === 4) {
        try {
          const codes = await det.detect(v);
          if (codes.length) handle(codes[0].rawValue);
        } catch (e) { /* un frame ilegible no detiene el bucle */ }
      }
      requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    $('#camhint').textContent = 'No se pudo abrir la cámara: ' + e.message +
      ' — se puede seguir a mano.';
  }
};

$('#send').onclick = () => {
  const v = $('#manual').value.trim();
  if (v) { handle(v); $('#manual').value = ''; }
};
$('#manual').addEventListener('keydown', e => { if (e.key === 'Enter') $('#send').click(); });

$('#saveapi').onclick = () => {
  API = $('#api').value.trim();
  localStorage.setItem(LS_API, API);
  net(); refreshAforo();
  $('#camhint').textContent = API ? 'Endpoint guardado.' : 'Sin endpoint: modo local.';
};

net(); flush();
</script>
