<!doctype html>
<html lang="es" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeTicket — escáner de puerta</title>
<meta name="theme-color" content="#070707">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&display=swap">
<link rel="stylesheet" href="ft.css">

<style>
  /* El escáner vive en oscuro: se usa de noche, en la puerta. */
  body { padding: 0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px calc(40px + env(safe-area-inset-bottom)); }

  .brandbar { display: flex; align-items: center; gap: 10px; margin: 0 2px 16px; }
  .brandbar svg { height: 17px; width: auto; }
  .brandbar .tag {
    font-size: 11.5px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); padding-left: 10px; border-left: 1px solid var(--border-2);
  }
  .brandbar .sp { flex: 1; }

  .top { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .top select {
    flex: 1; min-width: 0; font: inherit; font-size: 13.5px; font-weight: 700;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 10px 11px;
  }
  .net {
    font-size: 11.5px; font-weight: 900; padding: 5px 11px; border-radius: var(--r-pill);
    border: 1px solid var(--border-2); color: var(--ink-2); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .net::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .net.off { color: var(--warn); border-color: #ffd10259; }
  .net.off::before { background: var(--warn); }

  .count { padding: 18px 20px; margin-bottom: 12px; --accent-line: var(--ft-yellow); }
  .count .n {
    font-size: 46px; font-weight: 900; line-height: 1; letter-spacing: -.045em;
    font-variant-numeric: proportional-nums;
  }
  .count .n .of { font-size: 20px; color: var(--ink-3); letter-spacing: -.02em; }
  .count .l { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
  .track { height: 8px; border-radius: 4px; background: var(--surface-3); margin-top: 14px; overflow: hidden; }
  .track > div { height: 100%; border-radius: 4px; background: var(--ft-yellow); width: 0;
                 transition: width .45s var(--ease); }

  /* overflow:hidden recorta el velo del retículo al recuadro de la cámara;
     sin esto el box-shadow de 2000px oscurece la página entera. */
  .camwrap { position: relative; margin-bottom: 12px; overflow: hidden; border-radius: var(--r-md); }
  #cam { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000;
         border-radius: var(--r-md); display: block; border: 1px solid var(--border); }
  .reticle {
    position: absolute; inset: 17%; border-radius: var(--r-md); pointer-events: none;
    box-shadow: 0 0 0 2px #ffd10285, 0 0 0 2000px #00000059;
  }
  .flash { position: absolute; inset: 0; border-radius: var(--r-md); opacity: 0;
           pointer-events: none; transition: opacity .18s var(--ease); }
  .flash.on { opacity: .5; }

  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row input {
    flex: 1; min-width: 0; font: inherit; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 11px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  .row input::placeholder { color: var(--ink-3); }
  .btn--wide { width: 100%; padding: 13px 20px; font-size: 15px; }

  .banner {
    border-radius: var(--r-md); padding: 15px 17px; margin-bottom: 12px;
    font-weight: 900; font-size: 17px; letter-spacing: -.02em; display: none;
    align-items: center; gap: 12px;
  }
  .banner.show { display: flex; }
  .banner .ic { font-size: 22px; line-height: 1; flex: none; }
  .banner .s { font-weight: 500; font-size: 13px; letter-spacing: 0; opacity: .92; margin-top: 1px; }
  .b-ok  { background: var(--ok);   color: #04140b; }
  .b-dup { background: var(--ft-yellow); color: var(--ft-yellow-ink); }
  .b-bad { background: var(--danger); color: #fff; }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--ink-3); margin: 20px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px;
       border-top: 1px solid var(--border); font-size: 13px; }
  li .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); }
  li .r { font-weight: 900; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  li .r::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .r-ok { color: var(--ok); } .r-dup { color: var(--warn); }
  .r-bad { color: var(--danger); } .r-q { color: var(--ink-3); }

  .hint { color: var(--ink-3); font-size: 12.5px; margin: 10px 0 0; }
  details { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 14px; }
  summary { color: var(--ink-3); font-size: 12.5px; font-weight: 700; cursor: pointer; }
  details .row { margin-top: 12px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
         background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
</style>

<div class="wrap">
  <div class="brandbar">
    <svg viewBox="0 0 118 21" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>FreeTicket</title>

      <path d="M6.24968 20.6234V9.64547H10.4843V6.54613H6.24968V5.59039C6.24968 3.85237 7.18423 3.04135 8.41076 3.04135C9.14086 3.04135 9.84168 3.30214 10.6011 3.79445L11.9152 1.15868C10.7471 0.405432 9.43291 0 8.1771 0C5.28592 0 2.6868 1.76691 2.6868 5.59039V6.54613H0V9.64547H2.6868V20.6234H6.24968ZM11.6483 6.34348V20.6234H15.2112V13.0924C15.2112 10.4565 16.9342 9.47171 18.8033 9.47171C19.9713 9.47171 20.643 9.79027 21.3731 10.3986L22.9794 7.32826C22.1908 6.54612 20.7599 5.96693 19.2705 5.96693C17.8102 5.96693 16.3209 6.22757 15.2112 7.99448L14.9483 6.34348H11.6483ZM37.2559 14.7434C37.8109 8.86349 34.8028 5.90894 29.9842 5.90894C25.3116 5.90894 22.3328 9.03717 22.3328 13.3821C22.3328 17.9586 25.2825 21 30.247 21C32.4374 21 34.9197 20.2469 36.4382 18.6828L34.1604 16.4525C33.3426 17.2924 31.6197 17.7849 30.3055 17.7849C27.7938 17.7849 26.2461 16.5103 26.0124 14.7434H37.2559ZM26.0709 11.818C26.5965 9.96417 28.1735 9.03717 30.101 9.03717C32.1453 9.03717 33.6054 9.96417 33.8391 11.818H26.0709ZM52.9343 14.7434C53.4893 8.86349 50.4812 5.90894 45.6626 5.90894C40.99 5.90894 38.0112 9.03717 38.0112 13.3821C38.0112 17.9586 40.9608 21 45.9254 21C48.1158 21 50.598 20.2469 52.1166 18.6828L49.8388 16.4525C49.0211 17.2924 47.2981 17.7849 45.9839 17.7849C43.4723 17.7849 41.9246 16.5103 41.6908 14.7434H52.9343ZM41.7493 11.818C42.275 9.96417 43.8519 9.03717 45.7794 9.03717C47.8237 9.03717 49.2839 9.96417 49.5176 11.818H41.7493Z" fill="#F9D402"/>
    </svg>
    <span class="tag">Escáner</span>
    <span class="sp"></span>
    <a class="badge badge--outline" href="./" style="text-decoration:none">Tablero</a>
  </div>

  <div class="top">
    <select id="ev" aria-label="Show"></select>
    <span class="net" id="net">en línea</span>
  </div>

  <div class="card count card--accent">
    <div class="n"><span id="in">0</span> <span class="of">/ <span id="exp">–</span></span></div>
    <div class="l" id="lbl">adentro · esperados</div>
    <div class="track"><div id="bar"></div></div>
  </div>

  <div class="banner" id="ban" role="status" aria-live="assertive"></div>

  <div class="camwrap">
    <video id="cam" playsinline muted></video>
    <div class="reticle"></div>
    <div class="flash" id="flash"></div>
  </div>

  <button class="btn btn--primary btn--wide" id="start">Encender la cámara</button>
  <p class="hint" id="camhint"></p>

  <h2>A mano</h2>
  <div class="row">
    <input id="manual" placeholder="FT1.ft_tkt_0000001.ft_evt_0031.…" autocomplete="off" aria-label="Código a mano">
    <button class="btn" id="send">Validar</button>
  </div>

  <h2>Últimos escaneos</h2>
  <ul id="log"></ul>

  <details>
    <summary>Configuración</summary>
    <div class="row">
      <input id="api" placeholder="https://…lambda-url.us-east-1.on.aws/" aria-label="Endpoint del ingest">
      <button class="btn" id="saveapi">Guardar</button>
    </div>
    <p class="hint">Endpoint del ingest. Se guarda en este teléfono. También se puede pasar por <code>?api=</code>.</p>
  </details>
</div>

<script>
const $ = s => document.querySelector(s);
const LS_API = 'ft_api', LS_Q = 'ft_queue', LS_DEV = 'ft_device';

const qs = new URLSearchParams(location.search);
// Endpoint desplegado. Se puede sobreescribir con ?api= o desde
// Configuración, para apuntar al mock local (scripts/mock_ingest.py).
const API_POR_DEFECTO = 'https://1q5q7pqmx9.execute-api.us-east-1.amazonaws.com';
if (qs.get('api')) localStorage.setItem(LS_API, qs.get('api'));
let API = localStorage.getItem(LS_API) || API_POR_DEFECTO;
$('#api').value = API;

let DEVICE = localStorage.getItem(LS_DEV);
if (!DEVICE) { DEVICE = 'puerta-' + Math.random().toString(36).slice(2, 7);
               localStorage.setItem(LS_DEV, DEVICE); }

let queue = JSON.parse(localStorage.getItem(LS_Q) || '[]');
const saveQ = () => localStorage.setItem(LS_Q, JSON.stringify(queue));
const seen = new Set();          // ticket_id que este dispositivo ya dejó entrar
let events = [], current = null, serverCount = null;

// ---------- red ----------
function net() {
  const on = navigator.onLine;
  $('#net').textContent = on ? (queue.length ? queue.length + ' en cola' : 'en línea') : 'sin señal';
  $('#net').className = 'net' + (on && !queue.length ? '' : ' off');
}
addEventListener('online', () => { net(); flush(); });
addEventListener('offline', net);

// ---------- catálogo de eventos ----------
fetch('data.json').then(r => r.json()).then(d => {
  events = d.events;
  $('#ev').innerHTML = events.map(e =>
    '<option value="' + e.event_id + '">' + e.venue + ' — ' + e.title.slice(0, 34) + '</option>').join('');
  pick(events[0].event_id);
}).catch(() => { $('#ev').innerHTML = '<option>sin data.json</option>'; });

$('#ev').onchange = e => pick(e.target.value);

function pick(id) {
  current = events.find(e => e.event_id === id) || null;
  seen.clear(); serverCount = null;
  render(); refreshAforo();
}

function render() {
  const local = seen.size;
  const n = serverCount !== null ? Math.max(serverCount, local) : local;
  $('#in').textContent = n;
  $('#exp').textContent = current ? current.expected : '–';
  $('#bar').style.width = current ? Math.min(100, n / current.expected * 100) + '%' : '0';
  $('#lbl').textContent = current
    ? 'adentro · esperados ' + current.expected + ' (rango ' + current.p10 + '–' + current.p90 + ')'
    : 'adentro · esperados';
  net();
}

async function refreshAforo() {
  if (!API || !current) return;
  try {
    const r = await fetch(API.replace(/\/$/, '') + '/aforo?event_id=' + current.event_id);
    if (r.ok) { serverCount = (await r.json()).adentro; render(); }
  } catch (e) { /* sin red: se queda con el conteo local */ }
}
setInterval(refreshAforo, 15000);

// ---------- feedback ----------
const CLS = { ok: 'b-ok', duplicado: 'b-dup', ya_recibido: 'b-dup', encolado: 'b-dup' };
const ICO = { ok: '✓', duplicado: '↺', ya_recibido: '↺', encolado: '⇡' };
const TXT = {
  ok: ['Adelante', 'entrada válida'],
  duplicado: ['Ya entró', 'este pase se escaneó antes'],
  ya_recibido: ['Ya registrado', 'este escaneo ya estaba en el servidor'],
  firma_invalida: ['No válido', 'el código no está firmado por FreeTicket'],
  evento_equivocado: ['Otro show', 'este pase no es de este evento'],
  expirado: ['Vencido', 'el pase ya caducó'],
  encolado: ['Guardado', 'sin señal — se sube cuando vuelva'],
  sin_scan_id: ['Error', 'escaneo sin identificador'],
};
function banner(result) {
  const [t, s] = TXT[result] || ['Error', result];
  const b = $('#ban');
  b.className = 'banner show ' + (CLS[result] || 'b-bad');
  b.innerHTML = '<span class="ic">' + (ICO[result] || '✕') + '</span>' +
                '<span>' + t + '<div class="s">' + s + '</div></span>';
  const f = $('#flash');
  f.style.background = result === 'ok' ? 'var(--ok)' : (CLS[result] ? 'var(--ft-yellow)' : 'var(--danger)');
  f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 180);
  if (navigator.vibrate) navigator.vibrate(result === 'ok' ? 40 : [60, 50, 60]);
  clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove('show'), 2600);
}

function logLine(qr, result) {
  const cls = result === 'ok' ? 'r-ok' : (CLS[result] ? 'r-dup' : 'r-bad');
  const tid = (qr || '').split('.')[1] || '—';
  const li = document.createElement('li');
  li.innerHTML = '<span class="t">' + tid + '</span><span class="r ' +
                 (result === 'encolado' ? 'r-q' : cls) + '">' + result + '</span>';
  $('#log').prepend(li);
  while ($('#log').children.length > 12) $('#log').lastChild.remove();
}

// ---------- el escaneo ----------
let lastCode = '', lastAt = 0;

async function handle(qr) {
  const now = Date.now();
  if (qr === lastCode && now - lastAt < 3000) return;   // la cámara ve el mismo QR 30 veces
  lastCode = qr; lastAt = now;

  const scan = {
    scan_id: (crypto.randomUUID ? crypto.randomUUID()
              : now + '-' + Math.random().toString(36).slice(2)),
    qr,
    event_id: current ? current.event_id : '',
    scanned_at: new Date().toISOString(),
    device_id: DEVICE,
    gate: 'principal',
    offline: !navigator.onLine,
  };

  // Optimista: la puerta no espera a la red. Si el ticket ya lo dejó pasar
  // este mismo dispositivo, es duplicado sin consultar nada.
  const tid = qr.split('.')[1];
  const localDup = tid && seen.has(tid);
  if (tid && !localDup) seen.add(tid);
  render();

  queue.push(scan); saveQ(); net();

  if (localDup) { banner('duplicado'); logLine(qr, 'duplicado'); flush(); return; }

  const results = await flush();
  const mine = results && results[scan.scan_id];
  const shown = mine || (navigator.onLine && API ? 'ok' : 'encolado');
  banner(shown); logLine(qr, shown);
  if (mine && mine !== 'ok') { if (tid) seen.delete(tid); render(); }
}

let flushing = false;
async function flush() {
  if (flushing || !API || !queue.length || !navigator.onLine) { net(); return null; }
  flushing = true;
  const batch = queue.slice(0, 200);
  try {
    const r = await fetch(API.replace(/\/$/, '') + '/scan', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ scans: batch }),
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const ids = new Set(batch.map(s => s.scan_id));
    queue = queue.filter(s => !ids.has(s.scan_id));   // idempotente: reenviar no duplica
    saveQ(); net();
    const map = {};
    for (const x of data.resultados || []) map[x.scan_id] = x.result;
    refreshAforo();
    return map;
  } catch (e) {
    net();               // se queda en cola; se reintenta al volver la red
    return null;
  } finally { flushing = false; }
}
setInterval(flush, 8000);

// ---------- cámara ----------
$('#start').onclick = async () => {
  if (!('BarcodeDetector' in window)) {
    $('#camhint').textContent =
      'Este navegador no trae lector de códigos (Safari no lo soporta). ' +
      'Usá Chrome en Android/escritorio, o pegá el código a mano abajo.';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false });
    const v = $('#cam');
    v.srcObject = stream; await v.play();
    $('#start').textContent = 'Cámara encendida';
    $('#start').disabled = true;
    $('#camhint').textContent = 'Apuntá al QR del pase.';

    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const tick = async () => {
      if (v.readyState === 4) {
        try {
          const codes = await det.detect(v);
          if (codes.length) handle(codes[0].rawValue);
        } catch (e) { /* un frame ilegible no detiene el bucle */ }
      }
      requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    $('#camhint').textContent = 'No se pudo abrir la cámara: ' + e.message +
      ' — se puede seguir a mano.';
  }
};

$('#send').onclick = () => {
  const v = $('#manual').value.trim();
  if (v) { handle(v); $('#manual').value = ''; }
};
$('#manual').addEventListener('keydown', e => { if (e.key === 'Enter') $('#send').click(); });

$('#saveapi').onclick = () => {
  API = $('#api').value.trim();
  localStorage.setItem(LS_API, API);
  net(); refreshAforo();
  $('#camhint').textContent = API ? 'Endpoint guardado.' : 'Sin endpoint: modo local.';
};

net(); flush();
</script>
</html>
