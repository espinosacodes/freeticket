<style>
  body { padding: 22px 14px 44px; display: flex; justify-content: center; }
  .sheet { width: 100%; max-width: 400px; }

  .brandbar { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; }
  .brandbar svg { height: 17px; width: auto; }
  .brandbar .tag {
    font-size: 11.5px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); padding-left: 10px; border-left: 1px solid var(--border-2);
  }

  .card { padding: 24px 22px 20px; --accent-line: var(--ft-yellow); }

  .venue { font-size: 19px; font-weight: 900; letter-spacing: -.02em; }
  .when { color: var(--ink-2); font-size: 14px; margin-top: 2px; }

  .figure { margin: 26px 0 0; }
  .figure .n {
    font-size: 68px; font-weight: 900; line-height: .88; letter-spacing: -.045em;
    font-variant-numeric: proportional-nums;
  }
  .figure .u { font-size: 15px; font-weight: 700; margin-top: 8px; }
  .figure .r { color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }

  .bar { height: 10px; border-radius: 5px; background: var(--surface-3);
         margin: 20px 0 8px; position: relative; }
  .bar .band { position: absolute; top: 1.5px; bottom: 1.5px; border-radius: 4px;
               background: var(--ft-yellow); width: 0; transition: width .7s var(--ease); }
  .bar .exp  { position: absolute; top: -2px; bottom: -2px; width: 2.5px; border-radius: 2px;
               background: var(--ink); }
  .of { color: var(--ink-3); font-size: 12.5px; }

  .rows { margin-top: 22px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
         padding: 12px 0; border-top: 1px solid var(--border); }
  .row .k { color: var(--ink-2); font-size: 14px; }
  .row .v { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .expnote { margin-top: 18px; font-size: 12px; color: var(--ink-3); text-align: center; }
  .actions { margin-top: 16px; display: flex; }
  .actions .btn { width: 100%; }

  .dead { text-align: center; padding: 42px 12px; }
  .dead .px { width: 30px; height: 30px; margin-bottom: 12px; color: var(--ink-3); }
  .dead .t { font-size: 19px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 6px; }
  .dead .s { color: var(--ink-2); font-size: 14px; }
</style>

  <div class="card card--accent" id="c">
    <div class="dead"><div class="s">Cargando…</div></div>
  </div>
</div>

<script>
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dead = (i, t, s) => document.getElementById('c').innerHTML =
  '<div class="dead"><svg class="px" shape-rendering="crispEdges" aria-hidden="true">' +
  '<use href="#px-' + i + '"/></svg>' +
  '<div class="t">' + t + '</div><div class="s">' + s + '</div></div>';

function decode(tok) {
  try {
    const pad = tok + '='.repeat((4 - tok.length % 4) % 4);
    const raw = atob(pad.replace(/-/g, '+').replace(/_/g, '/'));
    const [event_id, exp] = raw.split('|');
    return { event_id, exp: +exp };
  } catch (e) { return null; }
}

// Todo el render cuelga del hash y se hace una sola vez. Si el hash cambia
// sin recargar (otro link de puerta pegado en la misma pestaña) la tarjeta
// se quedaría mostrando el show anterior.
addEventListener('hashchange', () => location.reload());

const tok = location.hash.slice(1);
if (!tok) dead('label', 'Link incompleto', 'Falta el código del show.');
else {
  const t = decode(tok);
  if (!t) dead('alert', 'Link inválido', 'Este código no se puede leer.');
  else if (Date.now() / 1000 > t.exp)
    dead('clock', 'Este link ya caducó', 'Valía hasta 3 horas después del show. Pedí uno nuevo.');
  else fetch('data.json').then(r => r.json()).then(d => {
    const e = d.events.find(x => x.event_id === t.event_id);
    if (!e) return dead('search', 'Show no encontrado', 'El código apunta a un show que no está.');

    const dt = new Date(e.starts_at), expd = new Date(t.exp * 1000);
    // Mismo huso que la hora del show (que se muestra en UTC): si una va
    // en local y la otra en UTC, el link parece caducar antes del show.
    const hm = x => String(x.getUTCHours()).padStart(2, '0') + ':' + String(x.getUTCMinutes()).padStart(2, '0');
    const sg = v => v > 0 ? '+' + v : String(v);
    const pk = e.peak_min;
    // El porcentaje del decil pico, medido sobre los check-ins de julio,
    // no un 25% inventado que contradice la curva del tablero.
    const arrivals = Math.round(e.expected * (e.peak_pct || 0.25));

    document.getElementById('c').innerHTML =
      '<div class="venue">' + esc(e.venue) + '</div>' +
      '<div class="when">' + DAYS[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' · ' +
        String(dt.getUTCHours()).padStart(2, '0') + ':' +
        String(dt.getUTCMinutes()).padStart(2, '0') + ' · ' + esc(e.title) + '</div>' +

      '<div class="figure">' +
        '<div class="n">' + e.expected + '</div>' +
        '<div class="u">personas esperadas</div>' +
        '<div class="r">rango p10–p90 · ' + e.p10 + ' a ' + e.p90 + '</div>' +
      '</div>' +

      '<div class="bar">' +
        '<div class="band" data-w="' + ((e.p90 - e.p10) / e.sold * 100) +
          '" style="left:' + (e.p10 / e.sold * 100) + '%"></div>' +
        '<div class="exp" style="left:calc(' + (e.expected / e.sold * 100) + '% - 1.25px)"></div>' +
      '</div>' +
      '<div class="of">de ' + e.sold + ' entradas vendidas · ' +
        Math.round(e.rate * 100) + '% proyectado de asistencia</div>' +

      '<div class="rows">' +
        '<div class="row"><span class="k">Pico de llegada</span><span class="v">' +
          sg(pk) + ' a ' + sg(pk + 10) + ' min</span></div>' +
        '<div class="row"><span class="k">En ese pico entran</span><span class="v">~' + arrivals + '</span></div>' +
        '<div class="row"><span class="k">Sugerido en puerta</span><span class="v">' + e.staff + ' personas</span></div>' +
      '</div>' +

      '<div class="actions"><a class="btn btn--primary" href="escaner.html">Abrir el escáner</a></div>' +
      '<div class="expnote">Este link caduca a las ' + hm(expd) + '.</div>';

    requestAnimationFrame(() => {
      const b = document.querySelector('.bar .band');
      if (b) b.style.width = b.dataset.w + '%';
    });
  }).catch(() => dead('signal-off', 'Sin conexión', 'No se pudo cargar la proyección.'));
}
</script>
