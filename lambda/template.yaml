AWSTemplateFormatVersion: '2010-09-09'
Description: FreeTicket — ingest de escaneos de puerta (docs/01-scan-telemetry.md)

Parameters:
  QrSecret:
    Type: String
    NoEcho: true
    Description: Secreto HMAC que firma los QR. Ver docs/01-scan-telemetry.md.
  AllowOrigin:
    Type: String
    Default: '*'
    Description: Origen permitido por CORS. En producción, el dominio del escáner.

Resources:
  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: freeticket-scans
      # On-demand: la puerta es un pico de 20 minutos y luego nada. Pagar
      # capacidad provisionada por eso no tiene sentido.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: escribir-escaneos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Sin DeleteItem ni UpdateItem a propósito: el log es
              # append-only. La función no tiene permiso de reescribir la
              # historia aunque el código tuviera un bug.
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:GetItem]
                Resource: !GetAtt ScansTable.Arn

  Fn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: freeticket-scan-ingest
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt FnRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          SCANS_TABLE: !Ref ScansTable
          QR_SECRET: !Ref QrSecret
          ALLOW_ORIGIN: !Ref AllowOrigin
      Code:
        # Marcador: el workflow sube el código real con update-function-code
        # inmediatamente después. Así no hace falta un bucket de S3.
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 503, "body": "pendiente de desplegar"}

  # Se usa API Gateway y no una Lambda Function URL. Motivo concreto: esta
  # cuenta está bajo una organización que bloquea las Function URL públicas
  # —devuelven 403 incluso firmando con SigV4— y también
  # sts:AssumeRoleWithWebIdentity. La función es la misma; lo único que
  # cambia es la puerta de entrada. Ver docs/05-despliegue.md.
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: freeticket-scan
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Fn.Arn
      PayloadFormatVersion: '2.0'

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Fn.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'

Outputs:
  Endpoint:
    Description: URL base del ingest
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  Tabla:
    Value: !Ref ScansTable
